# ============================================================================
#  EvoCRM — Stack completa para Coolify (com correções NexCore já embutidas)
#  ----------------------------------------------------------------------------
#  Self-contained: já inclui PostgreSQL (pgvector) + Redis.
#  Os 6 bugfixes do processor entram automaticamente via montagem dos arquivos
#  da pasta ./patches (não precisa registry nem build custom).
#
#  COMO USAR NO COOLIFY (resumo — guia completo no README.md):
#   1. Coolify → New Resource → Docker Compose → "Public Repository"
#   2. Cole a URL deste repositório
#   3. Em cada domínio (frontend e gateway) coloque seu domínio
#   4. Defina a variável ENCRYPTION_KEY (o guia mostra como gerar)
#   5. Deploy
#
#  Os segredos (senhas, chaves) são gerados automaticamente pelo Coolify
#  na primeira vez (variáveis SERVICE_*). Você NÃO precisa inventá-los.
# ============================================================================

services:

  # -------------------------- Banco de dados (PostgreSQL + pgvector) --------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=evocrm
    volumes:
      - evocrm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evocrm"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------- Redis -----------------------------------------
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]
    volumes:
      - evocrm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------- Gateway (API pública) -------------------------
  gateway:
    image: evoapicloud/evo-crm-gateway:latest
    environment:
      # Coolify gera o domínio da API aqui (porta 3030)
      - SERVICE_FQDN_GATEWAY_3030
      - AUTH_UPSTREAM=auth:3001
      - CRM_UPSTREAM=crm:3000
      - CORE_UPSTREAM=core:5555
      - PROCESSOR_UPSTREAM=processor:8000
      - BOT_RUNTIME_UPSTREAM=bot_runtime:8080
    depends_on:
      - auth
      - crm
      - core
      - processor

  # -------------------------- Auth service ----------------------------------
  auth:
    image: evoapicloud/evo-auth-service-community:latest
    command: bash -c "bundle exec rails db:migrate 2>&1 || echo 'Migration had errors, continuing...'; bundle exec rails s -p 3001 -b 0.0.0.0"
    environment:
      - RAILS_ENV=production
      - RAILS_MAX_THREADS=5
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_SECRETKEYBASE}
      - JWT_SECRET_KEY=${SERVICE_BASE64_JWT}
      - EVOAI_CRM_API_TOKEN=${SERVICE_BASE64_CRMTOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DATABASE=evocrm
      - POSTGRES_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/1
      - FRONTEND_URL=${SERVICE_URL_FRONTEND}
      - BACKEND_URL=${SERVICE_URL_GATEWAY}
      - CORS_ORIGINS=${SERVICE_URL_FRONTEND},${SERVICE_URL_GATEWAY}
      - DOORKEEPER_JWT_SECRET_KEY=${SERVICE_BASE64_DOORKEEPER}
      - DOORKEEPER_JWT_ALGORITHM=hs256
      - DOORKEEPER_JWT_ISS=evo-auth-service
      - MFA_ISSUER=EvoCRM
      - SIDEKIQ_CONCURRENCY=10
      - ACTIVE_STORAGE_SERVICE=local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth_sidekiq:
    image: evoapicloud/evo-auth-service-community:latest
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    healthcheck:
      disable: true
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_SECRETKEYBASE}
      - JWT_SECRET_KEY=${SERVICE_BASE64_JWT}
      - EVOAI_CRM_API_TOKEN=${SERVICE_BASE64_CRMTOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DATABASE=evocrm
      - POSTGRES_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/1
      - CORS_ORIGINS=${SERVICE_URL_FRONTEND},${SERVICE_URL_GATEWAY}
      - DOORKEEPER_JWT_SECRET_KEY=${SERVICE_BASE64_DOORKEEPER}
      - DOORKEEPER_JWT_ALGORITHM=hs256
      - DOORKEEPER_JWT_ISS=evo-auth-service
      - MFA_ISSUER=EvoCRM
      - SIDEKIQ_CONCURRENCY=10
      - ACTIVE_STORAGE_SERVICE=local
    depends_on:
      - auth

  # -------------------------- CRM (Rails) -----------------------------------
  crm:
    image: evoapicloud/evo-ai-crm-community:latest
    # boot_patches: corrige webhook 400 (data vazio) e casing do QR (Qrcode vs qrcode)
    # direto no boot — sobrevive a redeploys pois o script vem do repo (./patches)
    command: sh -c "ruby /patches/crm_boot_patches.rb 2>/dev/null || true; until wget -qO- http://auth:3001/health >/dev/null 2>&1; do echo 'Waiting for auth...'; sleep 5; done; bundle exec rails db:migrate 2>&1 || echo 'Migration had errors, continuing...'; bundle exec rails s -p 3000 -b 0.0.0.0"
    volumes:
      # mídias do ActiveStorage compartilhadas entre crm e crm_sidekiq (e persistentes)
      - evocrm_storage:/app/storage
      - ./patches:/patches:ro
    environment:
      - RAILS_ENV=production
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_SECRETKEYBASE}
      - JWT_SECRET_KEY=${SERVICE_BASE64_JWT}
      - EVOAI_CRM_API_TOKEN=${SERVICE_BASE64_CRMTOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DATABASE=evocrm
      - POSTGRES_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/1
      - EVO_AUTH_SERVICE_URL=http://auth:3001
      - EVO_AI_CORE_SERVICE_URL=http://core:5555
      - BACKEND_URL=${SERVICE_URL_GATEWAY}
      - FRONTEND_URL=${SERVICE_URL_FRONTEND}
      - CORS_ORIGINS=${SERVICE_URL_FRONTEND},${SERVICE_URL_GATEWAY}
      - DISABLE_TELEMETRY=true
      - LOG_LEVEL=info
      - ENABLE_ACCOUNT_SIGNUP=true
      - ENABLE_PUSH_RELAY_SERVER=true
      - ENABLE_INBOX_EVENTS=true
      - BOT_RUNTIME_URL=http://bot_runtime:8080
      - BOT_RUNTIME_SECRET=${SERVICE_BASE64_BOTSECRET}
      - BOT_RUNTIME_POSTBACK_BASE_URL=http://crm:3000
      - EVO_AI_PROCESSOR_URL=http://processor:8000
    depends_on:
      - auth
      - core

  crm_sidekiq:
    image: evoapicloud/evo-ai-crm-community:latest
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - evocrm_storage:/app/storage
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_SECRETKEYBASE}
      - JWT_SECRET_KEY=${SERVICE_BASE64_JWT}
      - EVOAI_CRM_API_TOKEN=${SERVICE_BASE64_CRMTOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DATABASE=evocrm
      - POSTGRES_SSLMODE=disable
      - REDIS_URL=redis://redis:6379/1
      - EVO_AUTH_SERVICE_URL=http://auth:3001
      - EVO_AI_CORE_SERVICE_URL=http://core:5555
      - CORS_ORIGINS=${SERVICE_URL_FRONTEND},${SERVICE_URL_GATEWAY}
      - BACKEND_URL=${SERVICE_URL_GATEWAY}
      - FRONTEND_URL=${SERVICE_URL_FRONTEND}
      - BOT_RUNTIME_URL=http://bot_runtime:8080
      - BOT_RUNTIME_SECRET=${SERVICE_BASE64_BOTSECRET}
      - BOT_RUNTIME_POSTBACK_BASE_URL=http://crm:3000
      - EVO_AI_PROCESSOR_URL=http://processor:8000
    depends_on:
      - crm

  # -------------------------- Core service (Go) -----------------------------
  core:
    image: evoapicloud/evo-ai-core-service-community:latest
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DB_NAME=evocrm
      - DB_SSLMODE=disable
      - DB_MAX_IDLE_CONNS=10
      - DB_MAX_OPEN_CONNS=100
      - DB_CONN_MAX_LIFETIME=1h
      - DB_CONN_MAX_IDLE_TIME=30m
      - PORT=5555
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_SECRETKEYBASE}
      - JWT_SECRET_KEY=${SERVICE_BASE64_JWT}
      - JWT_ALGORITHM=HS256
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - EVOLUTION_BASE_URL=http://crm:3000
      - EVO_AUTH_BASE_URL=http://auth:3001
      - AI_PROCESSOR_URL=http://processor:8000
      - AI_PROCESSOR_VERSION=v1
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------- Processor (Python) — COM OS FIXES -------------
  # Os 6 bugfixes são embutidos na imagem via processor.Dockerfile
  # (o Coolify constrói a imagem a partir deste repositório).
  processor:
    build:
      context: .
      dockerfile: processor.Dockerfile
    command: sh -c "alembic upgrade head 2>&1 || echo 'Alembic migration had errors, continuing...'; python -m scripts.run_seeders; uvicorn src.main:app --host $$HOST --port $$PORT"
    volumes:
      - evocrm_processor_logs:/app/logs
    environment:
      - POSTGRES_CONNECTION_STRING=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/evocrm?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=false
      - REDIS_DB=0
      - REDIS_KEY_PREFIX=a2a_
      - REDIS_TTL=3600
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - SECRET_KEY_BASE=${SERVICE_BASE64_64_SECRETKEYBASE}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - EVOAI_CRM_API_TOKEN=${SERVICE_BASE64_CRMTOKEN}
      - EVO_AUTH_BASE_URL=http://auth:3001
      - EVO_AI_CRM_URL=http://crm:3000
      - CORE_SERVICE_URL=http://core:5555/api/v1
      - APP_URL=${SERVICE_URL_GATEWAY}
      - API_URL=${SERVICE_URL_GATEWAY}
      - API_TITLE=Agent Processor Community
      - API_DESCRIPTION=Agent Processor Community for Evo AI
      - API_VERSION=1.0.0
      - ORGANIZATION_NAME=Evo CRM
      - TOOLS_CACHE_ENABLED=true
      - TOOLS_CACHE_TTL=3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------- Bot runtime (Go) ------------------------------
  bot_runtime:
    image: evoapicloud/evo-bot-runtime:latest
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - REDIS_URL=redis://redis:6379/1
      - AI_PROCESSOR_URL=http://processor:8000
      - BOT_RUNTIME_SECRET=${SERVICE_BASE64_BOTSECRET}
      - AI_CALL_TIMEOUT_SECONDS=30
    depends_on:
      - processor

  # -------------------------- Frontend (React/Vite) -------------------------
  frontend:
    image: evoapicloud/evo-ai-frontend-community:latest
    environment:
      # Coolify gera o domínio do painel aqui (porta 80)
      - SERVICE_FQDN_FRONTEND_80
      - VITE_APP_ENV=production
      - VITE_API_URL=${SERVICE_URL_GATEWAY}
      - VITE_AUTH_API_URL=${SERVICE_URL_GATEWAY}
      - VITE_EVOAI_API_URL=${SERVICE_URL_GATEWAY}
      - VITE_AGENT_PROCESSOR_URL=${SERVICE_URL_GATEWAY}
    depends_on:
      - gateway

volumes:
  evocrm_postgres:
  evocrm_redis:
  evocrm_processor_logs:
  evocrm_storage:
